[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-sdk"
version = "0.1.2"
description = "A plug-and-play SDK to capture and audit tool calls in Agentic AI applications"
readme = "README.md"
authors = [
    { name = "Sanjay Nithin", email = "sanjaynithin220@gmail.com" }
]
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "langchain-core>=0.1.0"
]
